<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- Stepo store icon — candidate B (recommended).
       Deliver full-bleed square: iOS and the Play Store apply their own corner masks.
       Pill weight rule: height 15/100, min width 28 (no pill below ~1.9:1 dash). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#FA5C33"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <g fill="#FFF7F2">
    <rect x="48" y="11" width="38" height="15" rx="7.5"/>
    <rect x="16" y="32" width="34" height="15" rx="7.5"/>
    <rect x="46" y="53" width="30" height="15" rx="7.5"/>
    <rect x="16" y="74" width="28" height="15" rx="7.5"/>
  </g>
</svg>
